{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - AI-Solutions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

  <div class="admin-login-bg">
    <div class="login-card">

      <div class="login-logo">AI<span>-</span>Solutions</div>
      <h1 class="login-title">Admin Portal</h1>
      <p class="login-sub">Sign in to access the dashboard and manage enquiries.</p>

      {% if error %}
      <div class="error-msg show" id="loginError">
        Invalid username or password. Please try again.
      </div>
      {% else %}
      <div class="error-msg" id="loginError">
        Invalid username or password. Please try again.
      </div>
      {% endif %}

      <form id="loginForm" method="POST" action="{% url 'admin_login' %}">
        {% csrf_token %}

        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input
            class="form-input"
            type="text"
            id="username"
            name="username"
            placeholder="admin"
            autocomplete="username"
            required
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input
            class="form-input"
            type="password"
            id="password"
            name="password"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          >
        </div>

        <div class="form-group" style="margin-top:8px;">
          <button type="submit" class="btn btn-primary btn-full">Sign In</button>
        </div>

      </form>

      <p style="text-align:center; margin-top:24px; font-size:13px; color:var(--text-secondary);">
        <a href="{% url 'index' %}" style="color:var(--accent); transition:color 0.2s ease;">← Back to website</a>
      </p>

    </div>
  </div>

  <script src="{% static 'js/script.js' %}"></script>
</body>
</html>
